<!doctype html>
<!-- THE BLUEPRINT — interactive strength, size & athletic transformation system -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Blueprint</title>
<meta name="description" content="Personal strength, size and mobility training plan with daily workouts and progress tracking.">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0E1316">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Blueprint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="preload" href="fonts/oswald.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Self-hosted (SIL Open Font License) so the app looks right offline */
  @font-face{font-family:'Oswald';font-style:normal;font-weight:200 700;font-display:swap;src:url(fonts/oswald.woff2) format('woff2')}
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/inter.woff2) format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:100 800;font-display:swap;src:url(fonts/jetbrains-mono.woff2) format('woff2')}
  :root{
    --bg:#0E1316; --bg2:#11181C; --surface:#161F24; --surface2:#1C272D;
    --line:#26343B; --line2:#33454E;
    --ink:#ECE7DD; --muted:#8A989F; --faint:#5C6A71;
    --ember:#EE7A2E; --ember-d:#C85F1C; --ember-glow:rgba(238,122,46,.16);
    --steel:#65B4C9; --steel-d:#3E8497;
    --green:#84B06A; --red:#D5694F; --gold:#D9A441;
    --r:14px; --r-s:9px;
    --shadow:0 14px 40px -18px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{margin:0;background:
      radial-gradient(1200px 600px at 80% -10%, rgba(238,122,46,.05), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(101,180,201,.05), transparent 55%),
      var(--bg);
    color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  ::selection{background:var(--ember-glow);color:var(--ink)}
  h1,h2,h3,h4{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.5px;margin:0;line-height:1.08}
  .mono{font-family:'JetBrains Mono',monospace}
  a{color:var(--steel);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,select{font-family:inherit}

  .shell{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
  nav.side{background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px;gap:3px;z-index:20;overflow-y:auto}
  .brand{padding:6px 10px 16px;border-bottom:1px solid var(--line);margin-bottom:10px}
  .brand .k{font-family:'Oswald';font-size:24px;font-weight:700;letter-spacing:2px;line-height:1}
  .brand .k b{color:var(--ember)}
  .brand .sub{font-size:9.5px;letter-spacing:2.6px;color:var(--faint);text-transform:uppercase;margin-top:5px}
  .navbtn{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:var(--r-s);
    color:var(--muted);font-weight:500;font-size:13.5px;text-align:left;width:100%;transition:.15s;position:relative}
  .navbtn .ic{width:18px;text-align:center;font-size:14px;opacity:.85}
  @media(hover:hover){.navbtn:hover{background:var(--surface);color:var(--ink)}}
  .navbtn.on{background:var(--surface2);color:var(--ink)}
  .navbtn.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--ember);box-shadow:0 0 12px var(--ember)}
  .side .phase-chip{margin-top:auto;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-size:11px}
  .side .phase-chip .l{color:var(--faint);text-transform:uppercase;letter-spacing:1.4px;font-size:9px}
  .side .phase-chip .v{font-family:'Oswald';font-size:15px;color:var(--ember);margin-top:3px}

  main{padding:34px 40px 90px;max-width:1140px;width:100%}
  .page{display:none}
  .page.on{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}

  .ttl{font-size:12.5px;letter-spacing:4px;text-transform:uppercase;color:var(--ember);font-family:'Oswald';font-weight:600}
  .h-big{font-size:40px;margin:6px 0 4px;letter-spacing:1px}
  .lead{color:var(--muted);max-width:720px;font-size:14.5px}
  .lead b{color:var(--ink)}

  .card{background:linear-gradient(180deg,var(--surface),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
  .grid{display:grid;gap:16px}
  .grid>*{min-width:0}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:760px){.g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr;gap:12px}}
  .ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;flex-wrap:wrap}
  .ch h3{font-size:20px;letter-spacing:.7px}
  .eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--faint);font-weight:600}
  .sec-intro{color:var(--muted);font-size:13.5px;margin:0 0 16px;max-width:760px}

  .stat{padding:16px 18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .stat .lab{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--faint)}
  .stat .num{font-family:'Oswald';font-size:32px;line-height:1;margin-top:6px}
  .stat .num small{font-size:13px;color:var(--muted);font-family:'JetBrains Mono'}
  .stat .delta{font-size:11px;margin-top:5px;font-family:'JetBrains Mono'}
  .up{color:var(--green)}.dn{color:var(--red)}

  .bar{height:10px;background:var(--bg);border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ember-d),var(--ember));box-shadow:0 0 14px var(--ember-glow);transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .barwrap{display:flex;flex-direction:column;gap:7px}
  .barrow{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
  .barrow b{color:var(--ink);font-family:'JetBrains Mono'}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:var(--r-s);background:var(--ember);color:#1a0e06;font-weight:600;font-size:13px;transition:.15s;border:1px solid transparent}
  @media(hover:hover){.btn:hover{background:#ff8a3d;transform:translateY(-1px)}}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent;border-color:var(--line2);color:var(--ink)}
  @media(hover:hover){.btn.ghost:hover{background:var(--surface2);transform:none}}
  .btn.sm{padding:6px 11px;font-size:12px}
  .btn.steel{background:var(--steel);color:#04181d}@media(hover:hover){.btn.steel:hover{background:#79c6da}}
  .seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:3px;gap:3px;flex-wrap:wrap}
  .seg button{padding:8px 15px;border-radius:6px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--surface2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line2)}
  input[type=number],input[type=text],input[type=date],select{background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 10px;font-size:13px;font-family:'JetBrains Mono';width:100%}
  input:focus,select:focus{outline:2px solid var(--ember-glow);border-color:var(--ember)}
  label.fld{display:block;font-size:11px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}

  .exo{border:1px solid var(--line);border-radius:var(--r);margin-bottom:11px;overflow:hidden;background:var(--surface)}
  .exo .top{display:flex;align-items:center;gap:14px;padding:13px 16px;cursor:pointer;transition:.15s}
  @media(hover:hover){.exo .top:hover{background:var(--surface2)}}
  .exo .top:active{background:var(--surface2)}
  .exo .idx{font-family:'Oswald';font-size:18px;color:var(--ember);width:24px}
  .exo .nm{flex:1;font-weight:600;font-size:14.5px}
  .exo .scheme{font-family:'JetBrains Mono';font-size:12px;color:var(--steel);white-space:nowrap}
  .exo .chev{color:var(--faint);transition:.2s;font-size:12px}
  .exo.open .chev{transform:rotate(90deg)}
  .exo .body{display:none;padding:0 16px 16px;border-top:1px solid var(--line)}
  .exo.open .body{display:block}
  .why{font-size:12.5px;color:var(--muted);padding:12px 0;border-bottom:1px dashed var(--line);margin-bottom:12px}
  .why b{color:var(--steel);font-weight:600}
  .cue{display:inline-block;font-size:11px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:3px 10px;margin:3px 4px 0 0;color:var(--muted)}
  .alt{font-size:11.5px;color:var(--faint);margin-top:10px}
  .alt b{color:var(--steel)}
  .setlog{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-top:12px}
  .setlog .sf{width:74px}
  .logline{font-size:11px;color:var(--faint);margin-top:8px;font-family:'JetBrains Mono'}
  .logline b{color:var(--green)}

  .chk{display:flex;align-items:flex-start;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:var(--r-s);margin-bottom:8px;background:var(--surface);transition:.15s;cursor:pointer}
  @media(hover:hover){.chk:hover{border-color:var(--line2)}}
  .chk:active{border-color:var(--line2)}
  .chk.done{background:rgba(132,176,106,.07);border-color:rgba(132,176,106,.35)}
  .box{width:21px;height:21px;border:2px solid var(--line2);border-radius:6px;flex-shrink:0;margin-top:1px;display:grid;place-items:center;transition:.15s;font-size:13px;color:transparent}
  .chk.done .box{background:var(--green);border-color:var(--green);color:#0c1408}
  .chk .ct{flex:1}.chk .ct .t{font-weight:600;font-size:14px}
  .chk.done .ct .t{text-decoration:line-through;color:var(--muted)}
  .chk .ct .d{font-size:12px;color:var(--muted);margin-top:2px}
  .chk .tag{font-size:10px;font-family:'JetBrains Mono';color:var(--steel);align-self:center;white-space:nowrap}

  .phase{border:1px solid var(--line);border-radius:var(--r);margin-bottom:16px;overflow:hidden}
  .phase .ph-head{display:flex;gap:16px;align-items:center;padding:18px 20px;background:var(--surface);cursor:pointer}
  .phase .ph-num{font-family:'Oswald';font-size:40px;font-weight:700;color:var(--ember);line-height:.8;width:54px;text-align:center;opacity:.9}
  .phase.locked .ph-num{color:var(--faint);opacity:.4}
  .phase .ph-t{flex:1}.phase .ph-t h3{font-size:21px}
  .phase .ph-t .when{font-family:'JetBrains Mono';font-size:11px;color:var(--steel);margin-top:3px}
  .phase .ph-body{padding:4px 20px 18px;background:var(--bg2)}
  .phase .ph-body p.aim{font-size:13.5px;color:var(--muted);margin:14px 0}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:'Oswald';font-weight:500;color:var(--faint);font-size:11px;letter-spacing:1px;text-transform:uppercase}
  td.mono,.tm{font-family:'JetBrains Mono';color:var(--steel)}
  td b{color:var(--ink)}

  .chart{width:100%;height:200px}
  .chart line.grid{stroke:var(--line);stroke-width:1}
  .chart path.ln{fill:none;stroke:var(--ember);stroke-width:2.5;filter:drop-shadow(0 2px 6px var(--ember-glow))}
  .chart circle{fill:var(--ember)}
  .chart text{fill:var(--faint);font-size:10px;font-family:'JetBrains Mono'}
  .chart path.goal{stroke:var(--steel);stroke-width:1.5;stroke-dasharray:5 5;fill:none;opacity:.6}

  .note{font-size:12px;color:var(--faint);background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--steel);border-radius:8px;padding:11px 14px;margin-top:14px}
  .note b{color:var(--ink)}
  .warn{border-left-color:var(--ember)}
  .pill{font-size:10px;font-family:'JetBrains Mono';padding:2px 8px;border-radius:20px;border:1px solid var(--line2);color:var(--muted)}
  .pill.e{border-color:var(--ember);color:var(--ember)}
  .pill.s{border-color:var(--steel);color:var(--steel)}
  .saved{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));right:24px;background:var(--surface2);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:10px;font-size:13px;font-family:'JetBrains Mono';opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:50}
  .saved.show{opacity:1;transform:none}
  .saved.err{border-color:var(--red);color:var(--red)}
  .tip-list{list-style:none;padding:0;margin:0}
  .tip-list li{padding:9px 0 9px 22px;position:relative;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--muted)}
  .tip-list li:last-child{border-bottom:none}
  .tip-list li::before{content:"▸";position:absolute;left:0;color:var(--ember)}
  .tip-list li b{color:var(--ink)}

  .appbar,.tabbar,.sheet{display:none}
  @media(max-width:880px){
    .shell{grid-template-columns:minmax(0,1fr)}
    nav.side{display:none}
    main{padding:calc(76px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
    .h-big{font-size:32px}
    .lead{font-size:14px}
    /* long intro paragraphs collapse to 3 lines; tap to expand */
    .lead{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;cursor:pointer}
    .lead.open{display:block;-webkit-line-clamp:unset}
    /* 16px stops iOS from zooming the page when a field is tapped */
    input[type=number],input[type=text],input[type=date],select{font-size:16px;padding:10px 12px;border-radius:10px}
    .btn{padding:11px 16px;font-size:14px}
    .btn.sm{padding:9px 13px;font-size:13px}
    .seg button{padding:10px 15px}
    .card{padding:18px}
    .stat{padding:14px}
    .stat .num{font-size:28px}
    .ind{padding:13px 14px}
    .ind .iv{font-size:26px}
    .setlog .sf{width:auto;flex:1;min-width:88px}
    .exo .top{gap:12px;padding:14px}
    .exo .nm{min-width:0}
    .exo .scheme{white-space:normal;text-align:right;max-width:45%}
    .setlog .addset{flex:1 1 100%;justify-content:center}
    .daychip{padding:11px 0;min-width:0}
    .saved{left:50%;right:auto;transform:translate(-50%,10px);bottom:calc(84px + env(safe-area-inset-bottom));white-space:nowrap}
    .saved.show{transform:translate(-50%,0)}

    .appbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:fixed;top:0;left:0;right:0;z-index:30;
      padding:calc(12px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 12px max(18px,env(safe-area-inset-left));
      background:rgba(14,19,22,.82);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);
      border-bottom:1px solid transparent;transition:border-color .2s}
    .appbar.scrolled{border-bottom-color:var(--line)}
    .appbar .k{font-family:'Oswald';font-size:19px;font-weight:700;letter-spacing:2px;line-height:1}
    .appbar .k b{color:var(--ember)}
    .appbar .ph{font-family:'Oswald';font-size:12px;letter-spacing:1px;color:var(--ember);border:1px solid rgba(238,122,46,.4);background:var(--ember-glow);padding:5px 10px;border-radius:20px;white-space:nowrap}

    .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;
      padding:6px max(6px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-left));
      background:rgba(14,19,22,.88);-webkit-backdrop-filter:saturate(160%) blur(18px);backdrop-filter:saturate(160%) blur(18px);border-top:1px solid var(--line)}
    .tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 5px;border-radius:12px;color:var(--faint);font-size:10.5px;font-weight:600;letter-spacing:.3px;transition:color .15s}
    .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .tab.on{color:var(--ember)}
    .tab.on svg{filter:drop-shadow(0 0 8px rgba(238,122,46,.45))}
    .tab:active{background:var(--surface)}

    .sheet{display:block;position:fixed;inset:0;z-index:29;pointer-events:none}
    .sheet .scrim2{position:absolute;inset:0;background:rgba(0,0,0,.55);opacity:0;transition:opacity .25s}
    .sheet .panel{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;
      padding:10px max(16px,env(safe-area-inset-right)) 18px max(16px,env(safe-area-inset-left));
      transform:translateY(calc(100% + 64px + env(safe-area-inset-bottom)));transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 50px -10px rgba(0,0,0,.6)}
    .sheet.open{pointer-events:auto}
    .sheet.open .scrim2{opacity:1}
    .sheet.open .panel{transform:none}
    .sheet .grab{width:38px;height:5px;border-radius:3px;background:var(--line2);margin:0 auto 14px}
    .sheet .grid{grid-template-columns:1fr 1fr;gap:10px}
    .sheet .item{display:flex;align-items:center;gap:12px;padding:15px 14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-weight:600;font-size:14px;text-align:left}
    .sheet .item.on{border-color:var(--ember);background:var(--ember-glow)}
    .sheet .item .ic{font-size:17px;color:var(--ember);width:22px;text-align:center}
    .sheet .phase-row{margin-top:12px;font-size:12px;color:var(--muted);text-align:center}
  }
  @media(max-width:380px){.appbar .ph{display:none}}

  /* ---------------- PRINT ---------------- */
  @media print{
    @page{margin:1.4cm}
    body{background:#fff!important}
    nav.side,.appbar,.tabbar,.sheet,.saved,.rest,details.recent{display:none!important}
    .shell{display:block!important}
    main{max-width:none!important;padding:0!important}
    .page{display:none!important}
    .page.on{display:block!important;animation:none!important}
    *{color:#111!important;box-shadow:none!important;text-shadow:none!important}
    .card,.stat,.exo,.phase,.chk,.note{background:#fff!important;border:1px solid #bbb!important;break-inside:avoid;page-break-inside:avoid}
    .ttl,.h-big,h1,h2,h3,h4,.exo .idx,.ph-num,.stat .num{color:#111!important}
    .scheme,.tm,td.mono{color:#444!important}
    input,.setlog,.btn,.seg,.bar,.chart{display:none!important}
    .lead{display:block!important;-webkit-line-clamp:unset!important}
    .why b,.note b,.pill{color:#111!important}
    a{color:#111!important}
    .print-break{page-break-before:always}
    .printhide{display:none!important}
    .screenonly{display:none!important}
    .printonly{display:block!important}
    .pweek{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}
  }
  .printonly{display:none}
  .day-hero{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:6px 0 18px}
  .day-hero .dnum{font-family:'Oswald';font-size:54px;font-weight:700;color:var(--ember);line-height:.8}
  .day-hero .dmiss{font-size:14px;color:var(--muted)}
  .simple-move{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
  .simple-move:last-child{border-bottom:none}
  .simple-move .smn{flex:1;font-weight:600;font-size:14.5px}
  .simple-move .smt{font-family:'JetBrains Mono';font-size:13px;color:var(--steel);white-space:nowrap}
  .daychip{padding:9px 0;border-radius:8px;font-family:'Oswald';font-size:14px;font-weight:600;letter-spacing:1px;
    border:1px solid var(--line);background:var(--surface);color:var(--muted);flex:1;text-align:center;min-width:42px}
  .daychip.on{background:var(--ember);color:#1a0e06;border-color:var(--ember)}
  .daychip.today::after{content:"•";color:var(--steel);margin-left:3px}
  .motiv{font-family:'Oswald';font-size:18px;font-weight:500;letter-spacing:.4px;line-height:1.3;
    color:var(--ink);border-left:3px solid var(--ember);padding:10px 0 10px 16px;margin:0 0 18px;
    background:linear-gradient(90deg,var(--ember-glow),transparent 70%)}
  .ind{padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
  .ind .il{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--faint)}
  .ind .iv{font-family:'Oswald';font-size:30px;line-height:1;margin-top:6px}
  .ind .iv small{font-size:13px;color:var(--muted);font-family:'JetBrains Mono'}
  .done-btn{width:100%;justify-content:center;margin-top:14px;padding:13px 16px;font-size:14px}
  .done-btn.is-done{background:rgba(132,176,106,.14);color:var(--green);border:1px solid rgba(132,176,106,.45)}
  .logline .undo{margin-left:8px;color:var(--muted);text-decoration:underline;font-size:11px;padding:4px 2px}
  .ind .ix{font-size:11px;color:var(--muted);margin-top:6px;font-family:'JetBrains Mono'}
  .target{font-size:12.5px;margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
  .target b{color:var(--ink)}
  .target.go{border-color:rgba(132,176,106,.45)}.target.go b{color:var(--green)}
  .upflag{font-size:10px;font-family:'JetBrains Mono';font-weight:500;color:var(--green);border:1px solid rgba(132,176,106,.45);border-radius:20px;padding:1px 7px;margin-left:4px;white-space:nowrap;vertical-align:2px}
  .upflag.later{color:var(--faint);border-color:var(--line2)}
  details.recent{margin-top:12px;font-size:13px}
  details.recent summary{cursor:pointer;color:var(--muted);font-size:12px;padding:6px 0}
  .entry{display:flex;align-items:center;gap:12px;padding:4px 0;border-bottom:1px solid var(--line)}
  .entry .mono{color:var(--faint);font-size:12px;width:92px;flex-shrink:0}
  .entry span:nth-child(2){flex:1}
  .del{color:var(--faint);padding:8px 10px;border-radius:6px;font-size:13px}
  @media(hover:hover){.del:hover{color:var(--red);background:var(--surface2)}}
  .chipbtn{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:7px 12px;color:var(--muted);margin:0 6px 6px 0}
  .chipbtn b{color:var(--ink);font-weight:600}
  .chipbtn:active{border-color:var(--ember)}
  .rest{position:fixed;right:24px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:51;display:none;align-items:center;gap:10px;background:var(--surface2);border:1px solid var(--steel);border-radius:14px;padding:7px 7px 7px 14px;box-shadow:var(--shadow)}
  .rest.show{display:flex}
  .rest .rl{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--steel)}
  .rest b{font-family:'JetBrains Mono';font-size:18px;min-width:50px}
  .rest button{font-size:13px;padding:8px 11px;border-radius:9px;border:1px solid var(--line2);color:var(--ink)}
  .rest.done{border-color:var(--green)}.rest.done b,.rest.done .rl{color:var(--green)}
  @media(max-width:880px){.rest{right:auto;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom))}}

<script>
/* ============================================================
   THE BLUEPRINT — persistence + state
   Uses browser localStorage (per-browser, per-device — see README).
   ============================================================ */
const KEY='blueprint:state:v2';
const store={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ console.warn('localStorage unavailable:',e); return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ console.warn('localStorage write failed (storage full or blocked):',e); return false; } }
};
/* Dates are LOCAL calendar days ("YYYY-MM-DD"). toISOString() would give the UTC day,
   which rolls over mid-evening in the Americas and splits a day's logs in two. */
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayStr=()=>ymd(new Date());
const parseYmd=s=>{const [y,m,d]=String(s).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const addDays=(ds,n)=>{const d=parseYmd(ds);d.setDate(d.getDate()+n);return ymd(d);};
const daysBetween=(a,b)=>Math.round((parseYmd(b)-parseYmd(a))/864e5);
const byDate=(a,b)=>String(a.date)<String(b.date)?-1:String(a.date)>String(b.date)?1:0;
/* One entry per calendar day: logging again the same day replaces it, so re-entering fixes a typo instead of adding a second point */
function upsertDay(arr,entry){const i=arr.findIndex(x=>x.date===entry.date);if(i>=0)arr[i]=entry;else{arr.push(entry);arr.sort(byDate);}}
const DEFAULTS={
  profile:{startWeight:167,goalWeight:195,heightIn:74,age:22,ageAsOf:null,activity:1.6,calAdj:0,startDate:null},
  weightLog:[{date:todayStr(),w:167}],
  measure:[], toeTouch:[], mobilityDone:{}, trainLog:{}, benchmarks:{1:[],2:[],3:[]},
  nutritionLog:{}, sleepLog:[], custom:{}, dailyDone:{}, quickMob:{}, lastBackup:null, lastCalAdj:null,
  phaseAt:null, goalAt:null   /* derived by updateProgress(); stored so phase/goal don't flicker around a threshold */
};
let S=null, saveTimer=null, saveMsg=null;
function flush(){ if(saveTimer===null)return true; clearTimeout(saveTimer); saveTimer=null; return store.set(KEY,JSON.stringify(S)); }
/* Every change goes through here, so the derived phase/goal state is refreshed before each save. msg replaces "✓ Saved" (e.g. a new PR). */
function persist(msg){ updateProgress(); clearTimeout(saveTimer); if(msg)saveMsg=msg; saveTimer=setTimeout(()=>{ saveTimer=null; const ok=store.set(KEY,JSON.stringify(S)); ok?toast(saveMsg||undefined):toast('✕ Not saved — storage is full or blocked',true); saveMsg=null; },350); }
let toastTimer=null;
function toast(msg='✓ Saved',err=false){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.toggle('err',err); t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),err?3200:msg==='✓ Saved'?1100:2600); }
/* iOS can freeze a home-screen app the moment it's swiped away — write pending changes immediately */
addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden')flush(); });
/* Merge stored/imported data over fresh defaults (deep copy, so defaults are never mutated) */
function normalize(data){
  const d=JSON.parse(JSON.stringify(DEFAULTS));
  const out=Object.assign(d,data&&typeof data==='object'&&!Array.isArray(data)?data:{});
  out.profile=Object.assign({},DEFAULTS.profile,out.profile||{});
  out.benchmarks=Object.assign({1:[],2:[],3:[]},out.benchmarks||{});
  ['weightLog','measure','toeTouch','sleepLog'].forEach(k=>{ if(!Array.isArray(out[k]))out[k]=[]; });
  ['mobilityDone','trainLog','nutritionLog','custom','dailyDone','quickMob'].forEach(k=>{ if(!out[k]||typeof out[k]!=='object'||Array.isArray(out[k]))out[k]={}; });
  out.weightLog=out.weightLog.filter(x=>x&&isFinite(x.w));
  if(!out.weightLog.length)out.weightLog=[{date:todayStr(),w:out.profile.startWeight}];
  ['weightLog','measure','toeTouch','sleepLog'].forEach(k=>out[k].sort(byDate));
  out.profile.calAdj=Number(out.profile.calAdj)||0;
  if(!out.profile.startDate)out.profile.startDate=out.weightLog[0].date;   /* week counter + deload cadence count from here */
  if(!out.profile.ageAsOf)out.profile.ageAsOf=todayStr();                  /* age counts up by itself from here */
  return out;
}
/* UI preferences (last tab, gym/no-gym) — per device, not part of backups */
const UIKEY='blueprint:ui:v1';
let UI={}; try{ UI=JSON.parse(store.get(UIKEY)||'{}')||{}; }catch(e){ UI={}; }
function saveUI(k,v){ UI[k]=v; store.set(UIKEY,JSON.stringify(UI)); }

/* ============================================================
   MOBILITY — daily, anywhere, ~12 min, exact durations
   ============================================================ */
const MOBILITY=[
  {t:"90/90 Diaphragmatic Breathing",d:"Lie on back, calves on a chair/couch (knees 90°). 8 slow breaths: 4s in through nose, 6–8s out, ribs pulled down.",tag:"90 sec",why:"Your pain on stretch is mostly protective <b>neural guarding</b>, not short tissue. Long exhales switch the nervous system out of fight-or-flight so the hamstrings stop bracing. This is the gate that makes everything after it work."},
  {t:"Cat–Cow + Segmental Roll",d:"On all fours. Slowly round then arch, moving one vertebra at a time, top to bottom.",tag:"8 reps",why:"Restores <b>segment-by-segment control</b> of the lumbar spine. Painful backs move as one rigid block; this teaches yours to bend smoothly under no load."},
  {t:"World's Greatest Stretch",d:"Lunge, hand inside front foot, drop elbow toward floor, then rotate that arm to the ceiling. Alternate.",tag:"5/side",why:"One move that opens <b>hip flexors, adductors, T-spine and ankles</b> at once — the four areas that, when locked, dump stress into your low back."},
  {t:"90/90 Hip Switches",d:"Sit, both knees bent 90°, one in front one out to the side. Rotate knees side to side, chest tall.",tag:"10/side",why:"Builds <b>internal + external hip rotation</b>. Locked hips force the lumbar spine to rotate in athletic movement — the #1 driver of your back strain on the court or field."},
  {t:"Hip CARs",d:"Stand tall, drive one knee up, draw the slowest, biggest circle you can with the hip. Reverse.",tag:"4/side ea way",why:"Actively expands <b>usable, controllable</b> hip range. Active range is what your body will let you use under load — passive range you can't control just gets you hurt."},
  {t:"Banded Active Straight-Leg Raise",d:"On back, band/towel around one foot. Actively pull the straight leg up as far as possible, lower slow.",tag:"10/side",why:"<b>Loaded contract-relax</b> for the hamstrings: you fire the hip flexors to reflexively relax the hamstring, gaining length with zero painful passive stretching."},
  {t:"90/90 Hamstring Active Reach",d:"One leg forward, heel down, knee soft. Hinge from the hip and reach hands toward the toe, return.",tag:"8/side",why:"Lengthens the hamstring through an <b>active hinge</b> — rehearsing the exact toe-touch pattern in a position your spine can stay safe in."},
  {t:"Couch Stretch (active)",d:"Rear shin up against a wall/couch, front foot planted. Squeeze the rear glute, tuck the pelvis. Hold.",tag:"30s/side",why:"Releases tight <b>hip flexors and quads</b>. Tight hip flexors yank your pelvis into a tilt that grinds the low back — free them and the pain often drops fast."},
  {t:"Knee-to-Wall Ankle Mob",d:"Toes ~4in from wall, drive knee past toes to touch the wall without the heel lifting. Inch back as you improve.",tag:"10/side",why:"Stiff ankles steal depth from squats and jumps, forcing the back and knees to compensate. Free ankles = a squat and a landing your joints tolerate — and a higher vert."},
  {t:"Jefferson Curl (light)",d:"Stand on a box, hold a light weight (or nothing). Roll down one vertebra at a time, then restack to stand.",tag:"5 reps",why:"The single best <b>toe-touch builder</b>. Gradually loaded spinal flexion teaches the back it's safe to round under control, switching off the guarding reflex. Bodyweight only to start."},
  {t:"McGill Big 3",d:"Curl-up (hold 8s ×4), Side plank (3×15s/side), Bird-dog (5/side, hold 3s). Brace, breathe, don't hold breath.",tag:"3 min",why:"Builds <b>endurance-based spinal stability</b> — Dr. McGill's protocol. A back that resists fatigue resists strain. This is your daily insurance policy; never skip it, gym or not."}
];
const TOE_MILES=[
  {gap:25,label:"Mid-shin",sub:"Starting point — own the hinge before the floor"},
  {gap:15,label:"Lower shin"},
  {gap:8,label:"Ankle bone"},
  {gap:0,label:"Fingertips to floor",sub:"The goal line"},
  {gap:-5,label:"Flat palms",sub:"Elite — stretch goal"}
];

/* ============================================================
   GYM PROGRAM — 4-day Upper/Lower; width, back, grip, traps
   each exercise carries a no-gym ALT inline too
   ============================================================ */
const GYM={
  "Upper A — Width & Press":[
    {id:"g_ohp",main:true,nm:"Seated DB Shoulder Press",s:"3 × 8–10",why:"Front + lateral delt mass and overhead strength for spiking and rebounding. Seated DBs keep load off your low back vs a standing barbell press.",cues:["Slight bench incline","Don't fully flare elbows","Stop an inch short of lockout"],alt:"Pike push-ups, or backpack standing press"},
    {id:"g_lat1",nm:"DB Lateral Raise",s:"4 × 12–15",why:"Your #1 WIDTH exercise. The lateral delt builds the 3D shoulder and the V-taper illusion. High volume, light, strict.",cues:["Lead with the elbow","Slight 'pour the jug' tilt","Slow negative, no swing"],alt:"Backpack/water-jug lateral raise"},
    {id:"g_row1",main:true,nm:"Chest-Supported DB Row",s:"4 × 10–12",why:"Back THICKNESS (mid-traps, rhomboids) with the chest pad absorbing all spinal load — zero risk to your back. Your most important row.",cues:["Drive elbows toward hips","1s squeeze at top","Full stretch at bottom"],alt:"Inverted row under a table, or backpack row"},
    {id:"g_inc",nm:"Incline DB Press",s:"3 × 8–10",why:"Upper chest + front delt. The DB path lets the shoulders move naturally — the joint-friendly horizontal pressing you need.",cues:["~30° bench","Elbows ~45°","Control the stretch"],alt:"Decline/feet-elevated push-ups"},
    {id:"g_pull1",nm:"Wide-Grip Lat Pulldown",s:"3 × 10–12",why:"Direct lat WIDTH and your pull-up progression. Wide grip biases the upper-outer lat that flares the taper.",cues:["Pull to collarbone","Drive elbows down & back","No leaning back"],alt:"Pull-ups (bar, branch, door frame)"},
    {id:"g_lat2",nm:"Cable Lateral Raise",s:"3 × 15",why:"Constant tension through the whole range — cables load the bottom where DBs go light. Width finisher.",cues:["Cable behind the back","One arm at a time","Burn over weight"],alt:"Lean-away band lateral raise"},
    {id:"g_face",nm:"Face Pull",s:"3 × 15–20",why:"Rear delts + external rotators = the 'back' of wide shoulders and shoulder INSURANCE. Balances all your pressing.",cues:["Pull to the forehead","Rotate pinkies back","Keep elbows high"],alt:"Band face pull, or prone Y-T-W raises"}
  ],
  "Lower A — Back-Safe Strength + Vert":[
    {id:"g_jump",plyo:true,nm:"Box Jump / Pogo Hops",s:"4 × 3 (P2+)",why:"PRIME for VERT and explosiveness. Done fresh, before the heavy work, these train fast force — the basis of jumping in volleyball/basketball. Quality over quantity, full rest. Add in Phase 2.",cues:["Land soft & quiet","Reset every rep","Step down, never jump down"],alt:"Broad jumps / tuck jumps on grass"},
    {id:"g_gob",nm:"Goblet Squat",s:"3 × 10–12",why:"Teaches an upright, back-friendly squat. The front-loaded DB forces a vertical torso, sparing the lumbar spine while you rebuild the pattern.",cues:["Elbows inside knees","Sit between the hips","Heels glued down"],alt:"Backpack goblet squat or tempo air squat"},
    {id:"g_lp",nm:"Leg Press / Hack Squat",s:"3 × 12",why:"Heavy quad/glute loading with the back fully supported. How you train legs HARD without spinal compression.",cues:["Feet mid-platform","Don't round the low back","Stop before the glutes lift"],alt:"Bulgarian split squat (backpack loaded)"},
    {id:"g_rdl",nm:"DB Romanian Deadlift (light)",s:"3 × 10",why:"Re-grooves the HINGE your tight hamstrings stole. Start light — it's a mobility + strength drill before it's a strength lift.",cues:["Push hips BACK","Soft knees","Stop at first hamstring stretch — don't chase the floor yet"],alt:"Single-leg RDL, bodyweight or backpack"},
    {id:"g_curl",nm:"Leg Curl",s:"3 × 12",why:"Direct hamstring size. Strong hamstrings protect the knee, balance the quads, and prevent the #1 athletic injury (hamstring strains).",cues:["Slow negative","Full squeeze","Toes neutral"],alt:"Nordic curl negatives (anchor feet)"},
    {id:"g_ext",nm:"45° Back Extension",s:"3 × 12–15",why:"Builds bulletproof, endurant ERECTORS in a supported range. A strong low back is the opposite of a painful one.",cues:["Round then extend slowly","Squeeze glutes at top","Bodyweight first"],alt:"Superman holds / reverse hyper on a bed edge"},
    {id:"g_calf1",nm:"Standing Calf Raise",s:"4 × 12–15",why:"Calves drive jumping and need volume + deep stretch. Strong, mobile calves also fix the ankle stiffness feeding your back issues.",cues:["Full stretch at bottom","2s squeeze at top","No bouncing"],alt:"Single-leg calf raise off a step"}
  ],
  "Upper B — Width, Pull & Grip":[
    {id:"g_pu",nm:"Pull-Up / Assisted Pull-Up",s:"3 × AMRAP",why:"King of back width + grip + overhead pulling for 'farm' tasks. Band/machine assist until bodyweight reps come.",cues:["Full dead hang start","Chest to bar","Control the descent"],alt:"Doorway/towel rows or inverted rows"},
    {id:"g_lat3",nm:"Machine / Cable Lateral Raise",s:"4 × 15",why:"Second weekly lateral-delt hit from a new angle. Width is won through frequency — delts recover fast and love volume.",cues:["Smooth tempo","Pause at the top","Match both sides"],alt:"Backpack lateral raise"},
    {id:"g_seal",nm:"Seal Row / Chest-Supported Row",s:"4 × 10",why:"Pure mid-back thickness, torso fully supported — removes momentum AND spinal load. Hits traps/rhomboids clean.",cues:["Elbows wide for upper back","Pause at the chest","No hip drive"],alt:"Inverted row, feet elevated"},
    {id:"g_flat",main:true,nm:"Flat DB Press",s:"3 × 8–10",why:"Your main horizontal press — dumbbells only, as you specified. Bigger stretch and a shoulder-friendly path vs a barbell.",cues:["Wrists stacked over elbows","Lower to chest line","Don't slam the bottom"],alt:"Standard / archer push-ups"},
    {id:"g_sap",nm:"Straight-Arm Pulldown",s:"3 × 12–15",why:"Isolates the lats in their lengthened range and teaches you to FEEL the lat — pure width work most people skip.",cues:["Stiff arms","Slight hinge","Squeeze lats, not triceps"],alt:"Band straight-arm pulldown"},
    {id:"g_shrug",nm:"DB Shrug / Trap-Bar Shrug",s:"3 × 12–15",why:"Upper-TRAP thickness — the muscle that frames the neck and screams strength. Also stabilises the shoulder under carries.",cues:["Straight up, don't roll","2s hold at top","Heavy is fine here"],alt:"Backpack shrugs / loaded carry holds"},
    {id:"g_grip",nm:"Dead Hang + Plate Pinch",s:"3 × max hold",why:"Direct GRIP and forearm work — grip is the bottleneck for everything 'functional': carrying, hauling, holding a bat. Crushing grip also boosts whole-body force output.",cues:["Hang full, shoulders active","Pinch plates smooth-side out","Time every set, beat it"],alt:"Towel dead hang / backpack-handle pinch carry"}
  ],
  "Lower B — Power, Carries & Posterior":[
    {id:"g_dj",plyo:true,nm:"Depth Jump / Broad Jump",s:"4 × 3 (P3)",why:"Reactive POWER for max vert — the stretch-shortening cycle that makes you spring off the floor. Advanced; add only in Phase 3 once landings are clean. Full rest between reps.",cues:["Minimal ground contact","Stick the landing","Stop if form degrades"],alt:"Broad jumps / bounding on grass"},

/* Bodyweight = average of the last 7 days of weigh-ins. Daily water swings of 2–3 lb shouldn't flip the phase
   or the calorie target; if you weigh in weekly this is simply your latest weigh-in. */
function curWeight(){ const L=S.weightLog; if(!L.length)return S.profile.startWeight; const cut=addDays(L[L.length-1].date,-6);
  const win=L.filter(x=>x.date>=cut); return Math.round(win.reduce((a,x)=>a+x.w,0)/win.length*10)/10; }
function lastWeighIn(){ return S.weightLog.length?S.weightLog[S.weightLog.length-1]:null; }
/* Rate of gain in lb/week: least-squares slope over the last 4 weeks of weigh-ins (needs 3+ weigh-ins spanning 2+ weeks) */
function gainRate(){ const L=S.weightLog; if(L.length<3)return null; const cut=addDays(L[L.length-1].date,-27);
  const pts=L.filter(x=>x.date>=cut).map(x=>[daysBetween(cut,x.date),x.w]); if(pts.length<3||pts[pts.length-1][0]-pts[0][0]<14)return null;
  const n=pts.length,mx=pts.reduce((a,p)=>a+p[0],0)/n,my=pts.reduce((a,p)=>a+p[1],0)/n;
  const sxx=pts.reduce((a,p)=>a+(p[0]-mx)**2,0); return sxx?pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/sxx*7:null; }
/* The plan's own rule, automated: outside the target band for your stage → add or drop ~200 kcal */
const CAL_STEP=200, ADJ_WAIT=14;
function rateCoach(){ const r=gainRate(), st=stage(), last=lastWeighIn(), gap=last?daysBetween(last.date,todayStr()):0;
  if(r===null)return {tone:'',msg:`<b>Rate of gain:</b> weigh in at least weekly for 2+ weeks and this will tell you whether to eat more or less (target ${st.aim}).`};
  const rs=`${r>=0?'+':''}${r.toFixed(2)} lb/wk`;
  if(gap>10)return {tone:'warn',msg:`<b>Rate of gain: ${rs}</b> as of your last weigh-in ${gap} days ago. Log a fresh weigh-in in Metrics so your targets stay accurate.`};
  if(r<st.lo)return {tone:'warn',delta:CAL_STEP,msg:`<b>Rate of gain: ${rs}</b> over the last 4 weeks, below target (${st.aim}). Eat ~${CAL_STEP} kcal more per day (mostly carbs).`};
  if(r>st.hi)return {tone:'warn',delta:-CAL_STEP,msg:`<b>Rate of gain: ${rs}</b> over the last 4 weeks, above target (${st.aim})${st.maintain?'':', so the extra is mostly fat'}. Eat ~${CAL_STEP} kcal less per day.${planWeek()<=4?' (Weeks 1–4 include water, glycogen and creatine weight, so only cut if it continues.)':''}`};
  return {tone:'',msg:`<b>Rate of gain: ${rs}</b> over the last 4 weeks, on target (${st.aim}). Keep eating exactly like this.`}; }
function coachNote(style=''){ const c=rateCoach(), la=S.lastCalAdj, wait=la&&daysBetween(la.date,todayStr())<ADJ_WAIT;
  const act=c.delta?(wait?`<div style="margin-top:6px">You changed calories by ${la.delta>0?'+':''}${la.delta} on ${esc(la.date)}. Give it 2 weeks before changing again.</div>`
    :`<div style="margin-top:10px"><button class="btn sm ${c.delta>0?'':'ghost'}" onclick="applyCalAdj(${c.delta})">${c.delta>0?'+':''}${c.delta} kcal to my daily target</button></div>`):'';
  return `<div class="note ${c.tone}" style="${style}">${c.msg}${act}</div>`; }

/* Training week (from the plan start date in Metrics) and the deload every 7th week */
const DELOAD_EVERY=7;
function planWeek(){ return Math.max(1,Math.floor(daysBetween(S.profile.startDate||todayStr(),todayStr())/7)+1); }
function isDeloadWeek(){ return planWeek()%DELOAD_EVERY===0; }

  return `Week ${wk} · ${isDeloadWeek()?'<b style="color:var(--gold)">deload week</b>':left===1?'deload next week':`deload in ${left} weeks`}`; }
/* Recent entries with a delete button. Without it, one mistyped weigh-in skews the phase, macros and charts for good. */
function recentList(key,label,fmtRow,n=6){ const arr=S[key]; if(!arr.length)return '';

  return `<details class="recent" data-key="${key}"><summary>${label} · fix or delete</summary>${rows}<div style="font-size:11.5px;color:var(--faint);margin-top:8px">Logging again on the same day replaces that day's entry.</div></details>`; }
function delEntry(key,i){ const x=S[key][i]; if(!x||!confirm(`Delete the ${x.date} entry?`))return; S[key].splice(i,1); persist(); render(curPage,false);
  const d=main.querySelector(`details.recent[data-key="${key}"]`); if(d)d.open=true; }
window.delEntry=delEntry;

function deloadNote(){ return isDeloadWeek()?`<div class="note warn" style="margin:0 0 16px"><b>Deload week (week ${planWeek()}).</b> Same sessions, but do ~60% of the sets at ~80% of your usual weight and stop well short of failure. It lets fatigue clear so the next block grows.</div>`:''; }
function backupAge(){ if(!S.lastBackup)return null; const d=Math.floor((Date.now()-S.lastBackup)/864e5); return d<=0?'today':d===1?'yesterday':`${d} days ago`; }
function hasLoggedData(){ return S.weightLog.length>1||S.measure.length||S.sleepLog.length||Object.keys(S.trainLog).length||Object.keys(S.nutritionLog).length||Object.keys(S.dailyDone).length; }
function backupNudge(){ const stale=!S.lastBackup||(Date.now()-S.lastBackup)>14*864e5; if(!stale||!hasLoggedData())return '';
  return `<button class="note warn" style="display:block;width:100%;text-align:left;margin:0 0 16px;font-size:12.5px" onclick="goto('metrics')">💾 <b>${S.lastBackup?`Last backup was ${backupAge()}.`:'You haven\'t backed up your data yet.'}</b> Your logs live only on this phone — tap to save a backup file.</button>`; }
/* Phase lines scale with your start and goal (the original plan: 176 and 188 lb for 167 → 195) */
function phaseCuts(){ const p=S.profile,span=p.goalWeight-p.startWeight; return {p2:Math.round(p.startWeight+span*0.32),p3:Math.round(p.startWeight+span*0.75)}; }
/* Phase and goal only move forward: a light week just under a line doesn't undo them. They drop back only if
   the average falls 3+ lb below the line, or the lines move because you changed start/goal weight. */
function updateProgress(){ const w=curWeight(),c=phaseCuts(),raw=w>=c.p3?3:w>=c.p2?2:1; let ph=S.phaseAt||raw;
  if(raw>ph||w<[0,0,c.p2,c.p3][ph]-3)ph=raw; S.phaseAt=ph;
  const g=S.profile.goalWeight; if(w>=g)S.goalAt=S.goalAt||todayStr(); else if(w<g-3)S.goalAt=null; }
function currentPhase(){ return S.phaseAt||1; }
function atGoal(){ return !!S.goalAt; }
/* Calorie surplus + target rate of gain per phase (midpoints of the phase table); at your goal it switches to maintenance */
const STAGES=[{surplus:300,lo:0.25,hi:0.75,aim:'≈0.5 lb/wk',short:'+0.5 lb/wk'},{surplus:425,lo:0.25,hi:0.75,aim:'≈0.5 lb/wk',short:'+0.5 lb/wk'},{surplus:250,lo:0.1,hi:0.5,aim:'≈0.25 lb/wk',short:'+0.25 lb/wk'}];
const MAINTAIN={surplus:0,lo:-0.25,hi:0.25,aim:'±0.25 lb/wk',short:'hold steady',maintain:true};
function stage(){ return atGoal()?MAINTAIN:STAGES[currentPhase()-1]; }
/* Age counts up from the day it was entered, so the calorie formula and the wording never go stale */
function curAge(){ const p=S.profile; return p.age+Math.max(0,Math.floor(daysBetween(p.ageAsOf||todayStr(),todayStr())/365.25)); }
const heightStr=()=>{const i=Math.round(S.profile.heightIn);return `${Math.floor(i/12)}'${i%12}"`;};
/* {tokens} in the plan text → numbers from your profile */
function fill(t){ const p=S.profile,c=phaseCuts(),span=p.goalWeight-p.startWeight;
  const v={age:curAge(),span:Math.round(span),p1lo:Math.round(p.startWeight+span*0.18),p1hi:c.p2-1,p2lo:c.p3-5,p3:c.p3,glo:p.goalWeight-5,ghi:p.goalWeight+5};
  return String(t).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m); }
function pct(v,a,b){ return Math.max(0,Math.min(100,(v-a)/(b-a)*100)); }
function macros(){
  const w=curWeight(),act=S.profile.activity,cm=S.profile.heightIn*2.54,kg=w/2.205;
  const bmr=10*kg+6.25*cm-5*curAge()+5, tdee=bmr*act;
  const cal=Math.round((tdee+stage().surplus+(S.profile.calAdj||0))/10)*10, protein=Math.round(w*1.0), fat=Math.round(w*0.45);
  const carbs=Math.round((cal-protein*4-fat*9)/4);
  return {cal,protein,fat,carbs,tdee:Math.round(tdee)};
}

      if(!(+rv>0&&+rv<1000))return bad('Reps (or seconds) must be a positive number');if(wv!==''&&!(+wv>=0&&+wv<1500))return bad('Weight looks wrong — check it');
      logSet(ex.id,wv,rv,node);startRest(restFor(ex));};
    box.appendChild(node);});}
const fmtSets=sets=>sets.map(s=>`${s.w||'BW'}×${s.r}`).join('  ');
/* Best set ever: highest estimated 1-rep max (Epley) for weighted sets; most reps (or seconds) for bodyweight work */
const e1rm=s=>s.w?s.w*(1+s.r/30):0;
const beats=(a,b)=>a.w||b.w?e1rm(a)>e1rm(b):a.r>b.r;
function bestSet(log){let best=null;log.forEach(e=>e.sets.forEach(s=>{if(!best||beats(s,best))best={w:s.w,r:s.r,date:e.date};}));return best;}
/* Which session the weekly schedule puts on each lift day (index into the GYM / TRAVEL session lists) */
const SESSION_DAY={gym:{Mon:0,Tue:1,Thu:2,Fri:3},travel:{Mon:0,Tue:2,Thu:1,Fri:2}};
function todaysSession(mode){const i=SESSION_DAY[mode][JS_DAY[new Date().getDay()]];return i==null?null:Object.keys(mode==='gym'?GYM:TRAVEL)[i];}
/* "3 × 8–10" → {sets:3,lo:8,hi:10}; null for holds, carries, AMRAP and combos, which just get "beat last time" */
function parseScheme(s){const m=/^(\d+) × (\d+)(?:–(\d+))?(?:\/leg|\/side| each)?(?: \(P\d\+?\))?$/.exec(s);return m?{sets:+m[1],lo:+m[2],hi:+(m[3]||m[2])}:null;}
const round5=n=>Math.max(5,Math.round(n/5)*5);
/* Today's target from the last session: the plan's own progression rule (top of the range on every set → add load) */
/* Phase 3 drops the main lifts to 5–8 reps (phase table); everything else keeps its listed range */
function schemeFor(ex){return ex.main&&currentPhase()===3?ex.s.replace(/× [\d–]+/,'× 5–8'):ex.s;}
function target(ex){const log=S.trainLog[ex.id]||[],t=todayStr(),prev=log.filter(x=>x.date!==t&&x.sets.length).pop(),sc=parseScheme(schemeFor(ex));
  const need=(/\(P(\d)/.exec(ex.s)||[])[1];
  if(need&&currentPhase()<need)return {flag:'later',msg:`<b>Not yet — this starts in Phase ${need}.</b> For now, practise soft, silent landings with a few easy pogo hops, or skip it.`};
  if(ex.plyo)return {msg:`<b>Quality, not quantity:</b> every rep max effort with a crisp, quiet landing. Full rest; stop if landings get sloppy.${prev?` Last time: ${fmtSets(prev.sets)}.`:''}`};
  if(!prev)return {msg:sc?`<b>First time:</b> pick a weight you can do for ${sc.hi} reps with ${['3–4','1–2','1–3'][currentPhase()-1]} left in the tank (Phase ${currentPhase()} effort), then log every set. That's your baseline.`:'<b>First time:</b> log what you do today. That\'s your baseline to beat.'};
  const topW=Math.max(...prev.sets.map(x=>x.w||0)),bw=!topW,top=prev.sets.filter(x=>(x.w||0)===topW),last=fmtSets(prev.sets);
  if(isDeloadWeek())return {msg:`<b>Deload week:</b> ~${Math.max(1,Math.round((sc?sc.sets:prev.sets.length)*0.6))} easy sets${bw?'':` at ~${round5(topW*0.8)} lb`}, well short of failure. Last time: ${last}.`};
  if(!sc)return {msg:`<b>Beat last time</b> (${last}) by a rep, a few seconds or a few metres.`};
  if(top.length>=sc.sets&&top.slice(0,sc.sets).every(x=>x.r>=sc.hi))return {flag:'up',msg:bw?`<b>You hit ${sc.hi} on every set last time.</b> Make it harder: load a backpack or use the tougher variation, and aim for ${sc.lo}+.`
    :`<b>You hit ${sc.hi} on every set at ${topW} lb.</b> Go up to the next weight (~${topW+5} lb) and aim for ${sc.lo}+ reps.`};
  return {msg:`<b>Stay at ${bw?'bodyweight':topW+' lb'}</b> and add a rep or two until every set reaches ${sc.hi}. Last time: ${last}.`};}
/* Rest between sets: ~2 min for heavier compounds (≤10 reps), ~90 s for isolation, plyos and holds */
function restFor(ex){const sc=parseScheme(schemeFor(ex));return !ex.plyo&&sc&&sc.hi<=10&&sc.hi>5?120:90;}
function renderLogline(id,node){const log=S.trainLog[id]||[];const t=todayStr();const e=log.find(x=>x.date===t);const prev=log.filter(x=>x.date!==t&&x.sets.length).pop();
  const box=node.querySelector('.logline');
  const best=bestSet(log);
  box.innerHTML=(e&&e.sets.length?`Today: <b>${fmtSets(e.sets)}</b><button class="undo">undo last</button>`:'')+
    (prev?`<div>Last time (${esc(prev.date)}): ${fmtSets(prev.sets)}</div>`:(e&&e.sets.length?'':'No log yet — set your baseline today.'))+
    (best&&prev?`<div>Best: <span style="color:var(--gold)">${fmtSets([best])}</span> (${esc(best.date)})</div>`:'');
  const u=box.querySelector('.undo');if(u)u.onclick=()=>{e.sets.pop();if(!e.sets.length)S.trainLog[id]=log.filter(x=>x!==e);renderLogline(id,node);persist();};}
function logSet(id,w,r,node){const t=todayStr();if(!S.trainLog[id])S.trainLog[id]=[];const prevBest=bestSet(S.trainLog[id]);
  let e=S.trainLog[id].find(x=>x.date===t);if(!e){e={date:t,sets:[]};S.trainLog[id].push(e);}const set={w:w?Number(w):null,r:Number(r)};e.sets.push(set);
  node.querySelector('.r').value='';renderLogline(id,node);persist(prevBest&&beats(set,prevBest)?`🏆 New best: ${fmtSets([set])}`:undefined);}

/* ---------------- SVG LINE CHART ---------------- */
const shortDate=ds=>{const d=parseYmd(ds);return isNaN(d)?esc(ds):d.toLocaleDateString(undefined,{month:'short',day:'numeric'});};
function drawLine(sel,data,opt={}){const box=$(sel);if(!box)return;const W=440,H=200,pad=30;
  if(!data||data.length<2){box.innerHTML=`<div class="note" style="margin:0">Log at least 2 entries to see your trend line.</div>`;return;}
  let vals=data.slice(),min=Math.min(...vals),max=Math.max(...vals);
  if(opt.goal!=null){min=Math.min(min,opt.goal);max=Math.max(max,opt.goal);}if(opt.start!=null){min=Math.min(min,opt.start);max=Math.max(max,opt.start);}
  if(min===max){min-=1;max+=1;}const range=max-min;
  const ds=opt.dates&&opt.dates.length===vals.length?opt.dates:null,span=ds?daysBetween(ds[0],ds[ds.length-1]):0;
  /* space points by date when we have them, so a gap in logging looks like a gap */
  const x=i=>pad+(span>0?daysBetween(ds[0],ds[i])/span:i/(vals.length-1))*(W-pad*2);const y=v=>opt.invert?pad+((v-min)/range)*(H-pad*2):H-pad-((v-min)/range)*(H-pad*2);
  const path=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');
  let goalLn='';if(opt.goal!=null){const gy=y(opt.goal).toFixed(1);goalLn=`<path class="goal" d="M${pad} ${gy} L${W-pad} ${gy}"/><text x="${W-pad}" y="${(+gy)-5}" text-anchor="end">goal ${opt.goal}</text>`;}
  const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===vals.length-1?3.5:2.2}"/>`).join('');
  box.innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><line class="grid" x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}"/>${goalLn}<path class="ln" d="${path}"/>${dots}<text x="${pad}" y="${H-8}">${ds?`${shortDate(ds[0])} → ${shortDate(ds[ds.length-1])} · `:''}${vals.length} logs</text><text x="${W-pad}" y="${H-8}" text-anchor="end" style="fill:var(--ember)">${vals[vals.length-1]}${opt.unit||''}</text><text x="${pad-4}" y="${y(max)+3}" text-anchor="end">${max.toFixed(0)}</text><text x="${pad-4}" y="${y(min)+3}" text-anchor="end">${min.toFixed(0)}</text></svg>`;}

  main.innerHTML=PAGES[page]();
  const pg=main.querySelector('.page'); if(pg)pg.classList.add('on');   /* <-- router fix */
  document.querySelectorAll('.navbtn,.tab,.sheet .item').forEach(b=>b.classList.toggle('on',b.dataset.go===page));
  const inMore=!['dash','daily','train','nutrition'].includes(page);
  const moreTab=document.querySelector('.tab[data-go="more"]'); if(moreTab)moreTab.classList.toggle('on',inMore);
  curPage=page; renderedDay=todayStr(); saveUI('page',page);
  if(page==='dash')renderWeekMini();
  if(page==='daily')wireDaily();
  if(page==='mobility')wireMobility();
  if(page==='train')wireTrain();
  if(page==='schedule')renderWeekFull();
  if(page==='recovery')wireRecovery();
  if(page==='nutrition')wireNutrition();
  if(page==='timeline')renderPhases();
  if(page==='metrics')wireMetrics();
  updatePhaseLabels();
  if(scroll)window.scrollTo({top:0,behavior:'instant'});
  closeSheet();
}
function updatePhaseLabels(){ const ph=currentPhase(), name=PHASES[ph-1].t.split('&')[0].split(',')[0].trim();
  $('#navphase').textContent=`Phase ${ph} — ${name}`; $('#appphase').textContent=`Phase ${ph} · ${name}`; $('#sheetphase').textContent=`Current phase: ${ph} — ${name}`; }
function goto(p){render(p);}
window.goto=goto;window.delFood=delFood;

function toggleDailyDone(){const t=todayStr();if(S.dailyDone[t])delete S.dailyDone[t];else S.dailyDone[t]=true;renderDaily();persist();}
function toggleQuickMob(){const t=todayStr();if(hasMob(t)){delete S.quickMob[t];S.mobilityDone[t]=[];}else S.quickMob[t]=true;renderDaily();persist();}
window.toggleDailyDone=toggleDailyDone;window.toggleQuickMob=toggleQuickMob;
function wireDaily(){renderDaily();document.querySelectorAll('#dmodeseg button').forEach(b=>{b.onclick=()=>{dailyMode=b.dataset.m;saveUI('dailyMode',dailyMode);document.querySelectorAll('#dmodeseg button').forEach(x=>x.classList.toggle('on',x===b));renderDaily();};});}
function wireMobility(){renderMobList();renderToe();$('#mobreset').onclick=()=>{S.mobilityDone[todayStr()]=[];delete S.quickMob[todayStr()];renderMobList();persist();};document.querySelectorAll('#ttside button').forEach(b=>b.onclick=()=>document.querySelectorAll('#ttside button').forEach(x=>x.classList.toggle('on',x===b)));
  $('#ttlog').onclick=()=>{const v=$('#ttinput').value,n=Math.abs(Number(v));if(v===''){$('#ttinput').focus();return;}if(!(n<=60))return bad('Enter the distance in cm (0–60)','#ttinput');
    const sign=Number($('#ttside button.on').dataset.s);upsertDay(S.toeTouch,{date:todayStr(),gap:n?n*sign:0});persist();render('mobility',false);};}
function wireTrain(){const t=todayStr();if(UI.trainAuto!==t){const ts=todaysSession(trainMode);if(ts){trainDay=ts;saveUI('trainDay',ts);}saveUI('trainAuto',t);}
  document.querySelectorAll('#modeseg button').forEach(b=>{b.onclick=()=>{trainMode=b.dataset.mode;trainDay=todaysSession(trainMode);saveUI('trainMode',trainMode);document.querySelectorAll('#modeseg button').forEach(x=>x.classList.toggle('on',x===b));renderDaySeg();renderExos();};});renderDaySeg();renderExos();}
function wireRecovery(){renderSleep();$('#sleeplog').onclick=()=>{const v=Number($('#sleepin').value);if(!v){$('#sleepin').focus();return;}if(!(v>0&&v<=16))return bad('Enter hours slept (0–16)','#sleepin');
  upsertDay(S.sleepLog,{date:todayStr(),h:v});persist();render('recovery',false);};}
function wireNutrition(){renderSupps();renderNutritionDay();$('#addfood').onclick=()=>{const name=$('#fname').value.trim()||'Meal';const cal=Number($('#fcal').value)||0,p=Number($('#fp').value)||0,c=Number($('#fc').value)||0,f=Number($('#ff').value)||0;if(!cal&&!p&&!c&&!f){$('#fcal').focus();return;}
  if([cal,p,c,f].some(v=>v<0)||cal>6000||p>500||c>1000||f>500)return bad('Those numbers look off — check them');addFood({name,cal,p,c,f});['#fname','#fcal','#fp','#fc','#ff'].forEach(s=>$(s).value='');};}
function wireMetrics(){renderMetrics();
  $('#wlogbtn').onclick=()=>{const v=Number($('#wlog').value);if(!v){$('#wlog').focus();return;}if(!(v>=70&&v<=450))return bad('Enter your bodyweight in lb (70–450)','#wlog');
    const ref=curWeight();if(Math.abs(v-ref)>ref*0.06&&!confirm(`${v} lb is ${Math.abs(v-ref).toFixed(1)} lb off your recent average (${ref} lb). Log it anyway?`))return;
    upsertDay(S.weightLog,{date:todayStr(),w:v});persist();render('metrics',false);};
  $('#mlogbtn').onclick=()=>{const m={date:todayStr(),shoulders:+$('#mS').value||null,chest:+$('#mC').value||null,waist:+$('#mW').value||null,arm:+$('#mA').value||null,forearm:+$('#mF').value||null,thigh:+$('#mT').value||null};if(!m.shoulders&&!m.chest&&!m.waist&&!m.arm&&!m.forearm&&!m.thigh){$('#mS').focus();return;}
    if(Object.values(m).some(v=>typeof v==='number'&&!(v>=2&&v<=100)))return bad('Measurements are in inches (2–100)');
    const same=S.measure.find(x=>x.date===m.date);if(same)Object.keys(m).forEach(k=>{if(m[k]!=null)same[k]=m[k];});else upsertDay(S.measure,m);
    ['#mS','#mC','#mW','#mA','#mF','#mT'].forEach(s=>$(s).value='');renderMetrics();persist();};
  $('#savesettings').onclick=()=>{const P=S.profile,n={startWeight:+$('#setStart').value||P.startWeight,goalWeight:+$('#setGoal').value||P.goalWeight,heightIn:+$('#setH').value||P.heightIn,age:+$('#setAge').value||curAge(),ageAsOf:todayStr(),activity:+$('#setAct').value||P.activity,calAdj:Math.round(+$('#setAdj').value)||0,startDate:$('#setDate').value||P.startDate};
    if(!(n.goalWeight>n.startWeight))return bad('Goal weight must be above start weight','#setGoal');if(!(n.heightIn>=48&&n.heightIn<=96))return bad('Height is in inches (48–96)','#setH');
    if(!(n.age>=13&&n.age<=99))return bad('Check your age','#setAge');if(!(n.activity>=1.2&&n.activity<=2.2))return bad('Activity should be 1.2–2.2','#setAct');
    if(Math.abs(n.calAdj)>1500)return bad('Calorie adjust should be within ±1500','#setAdj');if(n.startDate>todayStr())return bad('Plan start can\'t be in the future','#setDate');
    Object.assign(P,n);persist();render('metrics',false);};
  $('#exportbtn').onclick=async()=>{
    const name=`blueprint-backup-${todayStr()}.json`;
    const json=JSON.stringify(Object.assign({},S,{lastBackup:Date.now()}),null,2);
    const done=how=>{ S.lastBackup=Date.now(); persist(); $('#backupnote').innerHTML=`✓ Backup ${how} as <b>${name}</b> at ${new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}.`; };
    /* Phones: the share sheet is the reliable way out of a home-screen app ("Save to Files", AirDrop, email…) */
    const file=typeof File==='function'?new File([json],name,{type:'application/json'}):null;
    if(file&&matchMedia('(pointer:coarse)').matches&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Blueprint backup'}); done('saved'); }
      catch(err){ if(err&&err.name!=='AbortError')$('#backupnote').innerHTML='✕ Sharing failed — try again.'; }
      return;
    }
    const url=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    const a=document.createElement('a');
    a.href=url; a.download=name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    done('downloaded');
  };
  $('#importbtn').onclick=()=>$('#importfile').click();
  $('#importfile').onchange=(e)=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        const looksRight=parsed&&typeof parsed==='object'&&!Array.isArray(parsed)&&parsed.profile&&typeof parsed.profile==='object'&&Array.isArray(parsed.weightLog);
        if(!looksRight)throw new Error('not a Blueprint backup');
        if(!confirm('This will replace all current data in the app with the contents of this backup file. Continue?'))return;
        S=normalize(parsed);
        persist(); render('metrics');
        $('#backupnote').innerHTML=`✓ Backup restored successfully.`;
      }catch(err){ $('#backupnote').innerHTML=`✕ Could not read that file — is it a Blueprint backup .json?`; }
    };
    reader.readAsText(file);
    e.target.value='';
  };
}

/* Rest timer: starts when a set is logged; keeps the screen awake while it counts so the phone doesn't lock between sets */
let restEnd=0,restTick=null,wakeLock=null;
function startRest(sec){restEnd=Date.now()+sec*1000;$('#rest').classList.remove('done');$('#rest').classList.add('show');clearInterval(restTick);restTick=setInterval(tickRest,250);tickRest();keepAwake(true);}
function tickRest(){const left=Math.ceil((restEnd-Date.now())/1000);
  if(left>0){$('#resttime').textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`;return;}
  clearInterval(restTick);restTick=null;$('#resttime').textContent='Go';$('#rest').classList.add('done');keepAwake(false);
  if(navigator.vibrate)navigator.vibrate([200,100,200]);setTimeout(()=>{if(!restTick)stopRest();},6000);}
function stopRest(){clearInterval(restTick);restTick=null;$('#rest').classList.remove('show','done');keepAwake(false);}
async function keepAwake(on){try{
  if(on&&!wakeLock&&navigator.wakeLock&&document.visibilityState==='visible'){const l=await navigator.wakeLock.request('screen');if(restTick){wakeLock=l;l.addEventListener('release',()=>{if(wakeLock===l)wakeLock=null;});}else l.release();}
  else if(!on&&wakeLock){const l=wakeLock;wakeLock=null;await l.release();}
}catch(e){}}
$('#restplus').onclick=()=>{if(restTick)restEnd+=30000;else startRest(30);tickRest();};
$('#restx').onclick=stopRest;
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&restTick)keepAwake(true); });

let curPage='dash', renderedDay=null;
const sheet=$('#sheet');
function openSheet(){sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');}
function closeSheet(){sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');}
document.querySelectorAll('.navbtn,.sheet .item').forEach(b=>b.onclick=()=>render(b.dataset.go));
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  if(b.dataset.go==='more'){ sheet.classList.contains('open')?closeSheet():openSheet(); return; }
  if(b.dataset.go===curPage&&!sheet.classList.contains('open')){ window.scrollTo({top:0,behavior:'smooth'}); return; }
  render(b.dataset.go);
});
$('#sheetscrim').onclick=closeSheet;
/* tap a collapsed intro paragraph to expand it (phones) */
main.addEventListener('click',e=>{const l=e.target.closest('.lead');if(l)l.classList.toggle('open');});
const appbar=$('#appbar');
addEventListener('scroll',()=>appbar.classList.toggle('scrolled',scrollY>4),{passive:true});
/* An installed app can sit in memory overnight — refresh "today" when it comes back */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&renderedDay&&renderedDay!==todayStr()){ dailyDay=null; render(curPage,false); } });

(function(){const raw=store.get(KEY);
  let data=null; if(raw){try{data=JSON.parse(raw);}catch(e){data=null;}}
  S=normalize(data); updateProgress();
  render(PAGES[UI.page]?UI.page:'dash');
})();

/* Offline support + ask the browser not to evict our data */
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW registration failed:',e))); }
if(navigator.storage&&navigator.storage.persist){ navigator.storage.persist().catch(()=>{}); }
</script>
