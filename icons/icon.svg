<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The Blueprint app icon: an ember heart with a heartbeat line, on the app's dark blueprint grid.
       Everything important sits inside the central 80% circle, so Android's round/squircle masks never clip it.
       Source for icons/*.png — re-render them if you change this. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C272D"/>
      <stop offset="1" stop-color="#0A0F12"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="520" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#EE7A2E" stop-opacity=".28"/>
      <stop offset="1" stop-color="#EE7A2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#D2621C"/>
    </linearGradient>
    <pattern id="major" width="256" height="256" patternUnits="userSpaceOnUse">
      <path d="M256 0H0V256" fill="none" stroke="#65B4C9" stroke-opacity=".12" stroke-width="3"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#major)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <path fill="url(#ember)" d="M512 812C372 712 214 598 214 432C214 318 298 244 392 244C452 244 492 274 512 314C532 274 572 244 632 244C726 244 810 318 810 432C810 598 652 712 512 812Z"/>
  <!-- heartbeat: a dark outline under a light stroke keeps it crisp against both the heart and the background -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="#0E1316" stroke-width="72" d="M150 540H372L420 452L486 660L556 356L612 560L652 540H874"/>
    <path stroke="#ECE7DD" stroke-width="40" d="M150 540H372L420 452L486 660L556 356L612 560L652 540H874"/>
  </g>
</svg>
